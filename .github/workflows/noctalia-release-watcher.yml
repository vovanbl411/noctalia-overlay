---
name: Prepare Noctalia release

on:
  schedule:
    # 06:17 UTC: avoid the top-of-hour Actions load peak.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the planned rotation without creating a branch or Draft PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: noctalia-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare a stable Noctalia release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      GENTOO_PORTAGE_IMAGE: gentoo/portage@sha256:ce69e5b771bfe9404731e846b835346c34f2c82817ac3626f13af198689a1961
      GENTOO_STAGE3_IMAGE: gentoo/stage3@sha256:d8536e52677e3efe4caf048ca588bc685bc2d24d7fdfc882de1cdc6d38c81d96
    steps:
      - name: Check out the overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Discover the latest stable release
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/watch_noctalia_release.py \
              --dry-run \
              --result-json "$RUNNER_TEMP/noctalia-release.json" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/watch_noctalia_release.py \
              --result-json "$RUNNER_TEMP/noctalia-release.json" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare the release rotation
        id: rotation
        if: steps.watch.outputs.has_update == 'true'
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/prepare_noctalia_release.py \
              --dry-run \
              --release-tag "${{ steps.watch.outputs.release_tag }}" \
              --watch-result "$RUNNER_TEMP/noctalia-release.json" \
              --pull-request-request "$RUNNER_TEMP/noctalia-pull-request.json" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/prepare_noctalia_release.py \
              --release-tag "${{ steps.watch.outputs.release_tag }}" \
              --watch-result "$RUNNER_TEMP/noctalia-release.json" \
              --pull-request-request "$RUNNER_TEMP/noctalia-pull-request.json" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Python unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Generate Manifest and run pkgcheck
        env:
          HAS_UPDATE: ${{ steps.watch.outputs.has_update }}
          ROTATION_PREPARED: ${{ steps.rotation.outputs.prepared }}
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
        run: |
          set -eu
          docker create --name noctalia-portage "$GENTOO_PORTAGE_IMAGE" /bin/true
          cleanup() {
            docker rm -f noctalia-portage >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm \
            --volumes-from noctalia-portage \
            --volume "$GITHUB_WORKSPACE:/overlay" \
            --workdir /overlay \
            --env DRY_RUN \
            --env HAS_UPDATE \
            --env OVERLAY_GID="$(id -g)" \
            --env OVERLAY_UID="$(id -u)" \
            --env RELEASE_TAG \
            --env ROTATION_PREPARED \
            "$GENTOO_STAGE3_IMAGE" \
            /bin/bash -e -c '
              if [ "$DRY_RUN" != "true" ] && [ "$HAS_UPDATE" = "true" ] && [ "$ROTATION_PREPARED" = "true" ]; then
                ebuild "/overlay/gui-apps/noctalia/noctalia-${RELEASE_TAG#v}.ebuild" manifest
              fi
              emerge --oneshot app-portage/pkgcheck
              pkgcheck scan --exit
              chown -R "$OVERLAY_UID:$OVERLAY_GID" /overlay
            '

      - name: Create release branch and commit
        if: steps.rotation.outputs.prepared == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
        run: |
          set -eu
          branch="automation/noctalia-${RELEASE_TAG}"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md gui-apps/noctalia
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "update: Noctalia ${RELEASE_TAG}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            git push --force-with-lease="refs/heads/${branch}:refs/remotes/origin/${branch}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

      - name: Open Draft Pull Request
        if: steps.rotation.outputs.prepared == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/noctalia-pull-request.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            > "$RUNNER_TEMP/noctalia-pull-request-response.json"
          python3 -c 'import json, os; print("Draft PR: " + json.load(open(os.environ["RUNNER_TEMP"] + "/noctalia-pull-request-response.json", encoding="utf-8"))["html_url"])' \
            >> "$GITHUB_STEP_SUMMARY"
