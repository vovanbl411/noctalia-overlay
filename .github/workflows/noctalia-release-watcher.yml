---
name: Prepare Noctalia release

on:
  schedule:
    # 06:17 UTC: avoid the top-of-hour Actions load peak.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the planned rotation without creating a branch or Draft PR"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: noctalia-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare a stable Noctalia release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish_ready: ${{ steps.ready.outputs.publish_ready }}
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      GENTOO_PORTAGE_IMAGE: gentoo/portage@sha256:ce69e5b771bfe9404731e846b835346c34f2c82817ac3626f13af198689a1961
      GENTOO_STAGE3_IMAGE: gentoo/stage3@sha256:d8536e52677e3efe4caf048ca588bc685bc2d24d7fdfc882de1cdc6d38c81d96
    steps:
      - name: Check out the overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Discover the latest stable release
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/watch_noctalia_release.py \
              --dry-run \
              --result-json "$RUNNER_TEMP/noctalia-release.json" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/watch_noctalia_release.py \
              --result-json "$RUNNER_TEMP/noctalia-release.json" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide whether publishing is allowed
        id: eligibility
        env:
          OUTCOME: ${{ steps.watch.outputs.outcome }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/release_handoff.py publish-eligibility \
              --outcome "$OUTCOME" \
              --dry-run \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/release_handoff.py publish-eligibility \
              --outcome "$OUTCOME" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Run Python unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Create sanitized overlay workspace
        if: steps.watch.outputs.has_update == 'true'
        run: |
          python3 scripts/release_handoff.py copy-workspace \
            --source "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/noctalia-overlay"
          test ! -e "$RUNNER_TEMP/noctalia-overlay/.git"

      - name: Prepare the release rotation
        id: rotation
        if: steps.watch.outputs.has_update == 'true'
        env:
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/prepare_noctalia_release.py \
              --repository-root "$RUNNER_TEMP/noctalia-overlay" \
              --dry-run \
              --release-tag "$RELEASE_TAG" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/prepare_noctalia_release.py \
              --repository-root "$RUNNER_TEMP/noctalia-overlay" \
              --release-tag "$RELEASE_TAG" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record container workspace integrity
        if: steps.eligibility.outputs.publish_ready == 'true' && steps.rotation.outputs.prepared == 'true'
        run: |
          python3 scripts/release_handoff.py snapshot-workspace \
            --workspace "$RUNNER_TEMP/noctalia-overlay" \
            --output "$RUNNER_TEMP/noctalia-overlay-before-container.json"

      - name: Generate Manifest and run pkgcheck
        if: steps.eligibility.outputs.publish_ready == 'true' && steps.rotation.outputs.prepared == 'true'
        env:
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
        run: |
          set -eu
          test ! -e "$RUNNER_TEMP/noctalia-overlay/.git"
          docker create --name noctalia-portage "$GENTOO_PORTAGE_IMAGE" /bin/true
          cleanup() {
            docker rm -f noctalia-portage >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm \
            --volumes-from noctalia-portage \
            --mount "type=bind,src=$RUNNER_TEMP/noctalia-overlay,dst=/overlay" \
            --workdir /overlay \
            --env OVERLAY_GID="$(id -g)" \
            --env OVERLAY_UID="$(id -u)" \
            --env RELEASE_TAG \
            "$GENTOO_STAGE3_IMAGE" \
            /bin/bash -e -c '
              ebuild "/overlay/gui-apps/noctalia/noctalia-${RELEASE_TAG#v}.ebuild" manifest
              emerge --oneshot dev-util/pkgcheck
              pkgcheck scan --exit
              chown -R "$OVERLAY_UID:$OVERLAY_GID" /overlay
            '

      - name: Verify container workspace integrity
        if: steps.eligibility.outputs.publish_ready == 'true' && steps.rotation.outputs.prepared == 'true'
        run: |
          python3 scripts/release_handoff.py verify-workspace \
            --workspace "$RUNNER_TEMP/noctalia-overlay" \
            --baseline "$RUNNER_TEMP/noctalia-overlay-before-container.json"

      - name: Create release handoff
        id: handoff
        if: steps.eligibility.outputs.publish_ready == 'true' && steps.rotation.outputs.prepared == 'true'
        env:
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
          REMOVED_VERSION: ${{ steps.rotation.outputs.removed_version }}
          FALLBACK_VERSION: ${{ steps.rotation.outputs.fallback_version }}
          CANDIDATE_VERSION: ${{ steps.rotation.outputs.candidate_version }}
        run: |
          python3 scripts/release_handoff.py create \
            --source-root "$RUNNER_TEMP/noctalia-overlay" \
            --destination "$RUNNER_TEMP/release-handoff" \
            --watch-result "$RUNNER_TEMP/noctalia-release.json" \
            --release-tag "$RELEASE_TAG" \
            --base-commit "$GITHUB_SHA" \
            --removed-version "$REMOVED_VERSION" \
            --fallback-version "$FALLBACK_VERSION" \
            --candidate-version "$CANDIDATE_VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload release handoff
        if: steps.handoff.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-handoff
          path: ${{ runner.temp }}/release-handoff
          if-no-files-found: error
          retention-days: 30

      - name: Mark release handoff ready
        id: ready
        if: steps.handoff.outputs.created == 'true'
        run: echo "publish_ready=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish a stable Noctalia release
    needs: prepare
    if: needs.prepare.outputs.publish_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download release handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-handoff
          path: ${{ runner.temp }}/release-handoff

      - name: Validate and apply release handoff
        id: apply
        run: |
          python3 scripts/release_handoff.py apply \
            --handoff-root "$RUNNER_TEMP/release-handoff" \
            --repository-root "$GITHUB_WORKSPACE" \
            --expected-base-commit "$(git rev-parse HEAD)" \
            --pull-request-request "$RUNNER_TEMP/noctalia-pull-request.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify allowlisted release diff
        env:
          CANDIDATE_VERSION: ${{ steps.apply.outputs.candidate_version }}
          REMOVED_VERSION: ${{ steps.apply.outputs.removed_version }}
        run: |
          set -eu
          git diff --check
          expected_changes="$(printf '%s\n' \
            README.md \
            README.en.md \
            gui-apps/noctalia/Manifest \
            "gui-apps/noctalia/noctalia-${CANDIDATE_VERSION}.ebuild" \
            "gui-apps/noctalia/noctalia-${REMOVED_VERSION}.ebuild" | LC_ALL=C sort)"
          actual_changes="$(git diff --name-only | LC_ALL=C sort)"
          test "$actual_changes" = "$expected_changes"

      - name: Create release branch and commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.apply.outputs.branch }}
          RELEASE_TAG: ${{ steps.apply.outputs.release_tag }}
        run: |
          set -eu
          git switch --create "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md gui-apps/noctalia
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "update: Noctalia ${RELEASE_TAG}"
          original_remote="$(git remote get-url origin)"
          restore_remote() {
            git remote set-url origin "$original_remote"
          }
          trap restore_remote EXIT
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git push --force-with-lease="refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" origin "HEAD:refs/heads/${BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

      - name: Open Draft Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/noctalia-pull-request.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            > "$RUNNER_TEMP/noctalia-pull-request-response.json"
          python3 -c 'import json, os; print("Draft PR: " + json.load(open(os.environ["RUNNER_TEMP"] + "/noctalia-pull-request-response.json", encoding="utf-8"))["html_url"])' \
            >> "$GITHUB_STEP_SUMMARY"
