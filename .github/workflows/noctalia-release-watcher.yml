---
name: Prepare Noctalia release

on:
  schedule:
    # 06:17 UTC: avoid the top-of-hour Actions load peak.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the planned rotation without creating a branch or Draft PR"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: noctalia-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare a stable Noctalia release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      readiness: ${{ steps.ready.outputs.readiness }}
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      GENTOO_PORTAGE_IMAGE: gentoo/portage@sha256:ce69e5b771bfe9404731e846b835346c34f2c82817ac3626f13af198689a1961
      GENTOO_STAGE3_IMAGE: gentoo/stage3@sha256:d8536e52677e3efe4caf048ca588bc685bc2d24d7fdfc882de1cdc6d38c81d96
    steps:
      - name: Check out the overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the preparation checkout
        id: checkout
        run: python3 scripts/release_handoff.py verify-checkout --repository-root "$GITHUB_WORKSPACE"

      - name: Discover the latest stable release
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/watch_noctalia_release.py \
              --dry-run \
              --result-json "$RUNNER_TEMP/noctalia-release.json" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/watch_noctalia_release.py \
              --result-json "$RUNNER_TEMP/noctalia-release.json" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide whether publishing is allowed
        id: eligibility
        env:
          OUTCOME: ${{ steps.watch.outputs.outcome }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/release_handoff.py publish-eligibility \
              --outcome "$OUTCOME" \
              --dry-run \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/release_handoff.py publish-eligibility \
              --outcome "$OUTCOME" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Run Python unit tests
        id: unit_tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Create sanitized overlay workspace
        if: steps.watch.outputs.has_update == 'true'
        run: |
          python3 scripts/release_handoff.py copy-workspace \
            --source "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/noctalia-overlay"
          test ! -e "$RUNNER_TEMP/noctalia-overlay/.git"

      - name: Prepare the release rotation
        id: rotation
        if: steps.watch.outputs.has_update == 'true'
        env:
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/prepare_noctalia_release.py \
              --repository-root "$RUNNER_TEMP/noctalia-overlay" \
              --dry-run \
              --release-tag "$RELEASE_TAG" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/prepare_noctalia_release.py \
              --repository-root "$RUNNER_TEMP/noctalia-overlay" \
              --release-tag "$RELEASE_TAG" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the canonical release archive
        id: source
        if: steps.eligibility.outputs.publish_ready == 'true' && steps.rotation.outputs.prepared == 'true'
        env:
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
        run: |
          python3 scripts/release_handoff.py verify-source \
            --source-root "$RUNNER_TEMP/noctalia-overlay" \
            --watch-result "$RUNNER_TEMP/noctalia-release.json" \
            --release-tag "$RELEASE_TAG" \
            --distdir "$RUNNER_TEMP/noctalia-distfiles" \
            --evidence "$RUNNER_TEMP/noctalia-source.json"

      - name: Generate Manifest and run pkgcheck
        id: gentoo
        if: steps.source.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
        run: |
          set -eu
          test ! -e "$RUNNER_TEMP/noctalia-overlay/.git"
          checks="$(mktemp "$RUNNER_TEMP/noctalia-gentoo-checks.XXXXXX")"
          docker create --name noctalia-portage "$GENTOO_PORTAGE_IMAGE" /bin/true
          cleanup() {
            cat "$checks" >> "$GITHUB_STEP_SUMMARY"
            docker rm -f noctalia-portage >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm \
            --volumes-from noctalia-portage \
            --mount "type=bind,src=$RUNNER_TEMP/noctalia-overlay,dst=/overlay" \
            --mount "type=bind,src=$RUNNER_TEMP/noctalia-distfiles,dst=/distfiles,readonly" \
            --mount "type=bind,src=$checks,dst=/gentoo-checks" \
            --workdir /overlay \
            --env OVERLAY_GID="$(id -g)" \
            --env OVERLAY_UID="$(id -u)" \
            --env RELEASE_TAG \
            "$GENTOO_STAGE3_IMAGE" \
            /bin/bash -eu -c '
              manifest_generation="not run"
              pkgcheck_setup="not run"
              pkgcheck_scan="not run"
              report_checks() {
                echo "- Portage Manifest generation: $manifest_generation"
                echo "- pkgcheck setup: $pkgcheck_setup"
                echo "- pkgcheck scan: $pkgcheck_scan"
              }
              trap "report_checks >> /gentoo-checks" EXIT
              manifest_generation=failed
              DISTDIR=/distfiles ebuild "/overlay/gui-apps/noctalia/noctalia-${RELEASE_TAG#v}.ebuild" manifest
              manifest_generation=passed
              pkgcheck_setup=failed
              emerge --oneshot dev-util/pkgcheck
              pkgcheck_setup=passed
              pkgcheck_scan=failed
              pkgcheck scan --exit
              pkgcheck_scan=passed
              chown -R "$OVERLAY_UID:$OVERLAY_GID" /overlay
            '

      - name: Verify the Manifest and retained fallback
        id: manifest
        if: steps.gentoo.outcome == 'success'
        env:
          FALLBACK_VERSION: ${{ steps.rotation.outputs.fallback_version }}
        run: |
          python3 scripts/release_handoff.py verify-manifest \
            --source-root "$RUNNER_TEMP/noctalia-overlay" \
            --repository-root "$GITHUB_WORKSPACE" \
            --fallback-version "$FALLBACK_VERSION" \
            --distdir "$RUNNER_TEMP/noctalia-distfiles" \
            --evidence "$RUNNER_TEMP/noctalia-source.json"

      - name: Create release handoff
        id: handoff
        if: steps.manifest.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.watch.outputs.release_tag }}
          REMOVED_VERSION: ${{ steps.rotation.outputs.removed_version }}
          FALLBACK_VERSION: ${{ steps.rotation.outputs.fallback_version }}
          CANDIDATE_VERSION: ${{ steps.rotation.outputs.candidate_version }}
        run: |
          python3 scripts/release_handoff.py create \
            --source-root "$RUNNER_TEMP/noctalia-overlay" \
            --destination "$RUNNER_TEMP/release-handoff" \
            --watch-result "$RUNNER_TEMP/noctalia-release.json" \
            --release-tag "$RELEASE_TAG" \
            --base-commit "$GITHUB_SHA" \
            --removed-version "$REMOVED_VERSION" \
            --fallback-version "$FALLBACK_VERSION" \
            --candidate-version "$CANDIDATE_VERSION"

      - name: Upload release handoff
        id: upload
        if: steps.handoff.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-handoff
          if-no-files-found: error
          retention-days: 30

      - name: Mark release handoff ready
        id: ready
        if: >-
          steps.checkout.outcome == 'success' &&
          steps.watch.outcome == 'success' &&
          steps.unit_tests.outcome == 'success' &&
          steps.rotation.outcome == 'success' &&
          steps.source.outcome == 'success' &&
          steps.gentoo.outcome == 'success' &&
          steps.manifest.outcome == 'success' &&
          steps.handoff.outcome == 'success' &&
          steps.upload.outcome == 'success'
        env:
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python3 scripts/release_handoff.py ready \
            --handoff-root "$RUNNER_TEMP/release-handoff" \
            --evidence "$RUNNER_TEMP/noctalia-source.json"

      - name: Require readiness for an eligible release
        if: success() && steps.watch.outputs.outcome == 'release-available' && steps.ready.outputs.readiness == ''
        run: |
          echo "::error::Eligible release did not produce complete publication readiness."
          exit 1

      - name: Report preparation gate outcomes
        if: always()
        env:
          DISCOVERY: ${{ steps.watch.outcome }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          ROTATION: ${{ steps.rotation.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          GENTOO: ${{ steps.gentoo.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          HANDOFF: ${{ steps.handoff.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          READY: ${{ steps.ready.outcome }}
        run: |
          for gate in DISCOVERY UNIT_TESTS ROTATION SOURCE GENTOO MANIFEST HANDOFF UPLOAD READY; do
            case "${!gate}" in
              success) status=passed ;;
              failure) status=failed ;;
              skipped) status=skipped ;;
              cancelled) status='not run' ;;
              *) status=unknown ;;
            esac
            printf -- '- %s: %s\n' "$gate" "$status"
          done >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Full source build: not run\n- Runtime tests: not run\n' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish a stable Noctalia release
    needs: prepare
    if: >-
      github.repository == 'vovanbl411/noctalia-overlay' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'vovanbl411/noctalia-overlay/.github/workflows/noctalia-release-watcher.yml@refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      !inputs.dry_run &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.readiness != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      PREPARE_READY: ${{ needs.prepare.outputs.readiness }}
    steps:
      - name: Check out the trusted release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted publication context and prepare attempt
        id: preflight
        run: python3 scripts/release_handoff.py preflight --repository-root "$GITHUB_WORKSPACE"

      - name: Download exact release handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ steps.preflight.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-handoff-download
          digest-mismatch: error
          skip-decompress: true

      - name: Validate the handoff and publish a Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_handoff.py publish \
            --repository-root "$GITHUB_WORKSPACE" \
            --download "$RUNNER_TEMP/release-handoff-download" \
            --handoff-root "$RUNNER_TEMP/release-handoff"
