---
name: Watch Noctalia releases

on:
  schedule:
    # 06:00 UTC: avoid the top-of-hour Actions load peak.
    - cron: "00 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the result without creating an Issue"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: noctalia-release-watcher
  cancel-in-progress: false

jobs:
  watch:
    name: Check the latest stable release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run the release watcher
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: python3 scripts/watch_noctalia_release.py
